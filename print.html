<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>岁岁有新章 · A4 诵读讲义</title>
<style>
:root{--ink:#342e28;--red:#9c4338;--sand:#f6efe3;--soft:#77685c}
*{box-sizing:border-box}
html,body{margin:0;background:#e7e3dd;color:var(--ink)}
body{font-family:"Noto Serif CJK SC","Noto Serif SC","Songti SC","SimSun",serif;-webkit-font-smoothing:antialiased}
.preview-bar{width:min(210mm,95vw);margin:12px auto;display:flex;gap:14px;align-items:center;justify-content:space-between;font:13px sans-serif;color:#524b43}
.preview-bar button{background:#9c4338;color:#fff;border:0;padding:10px 20px;cursor:pointer}
.sheet{width:210mm;min-height:297mm;margin:0 auto 24px;padding:12mm 13mm 11mm;background:#fdfbf7;box-shadow:0 5px 35px #3a302425;position:relative;overflow:hidden}
.sheet::after{content:"";position:absolute;inset:9mm;pointer-events:none;border:1px solid #d5c6b2;opacity:.65}
.sheet>*{position:relative;z-index:1}
.topline{font:11px sans-serif;letter-spacing:.1em;color:#7f6558;display:flex;justify-content:space-between;border-bottom:1px solid #dbd0c1;padding-bottom:6px}
.banner{height:38mm;position:relative;margin:4mm 0 3mm;overflow:hidden;background:#f4ebdf}
.banner svg{position:absolute;inset:0;width:100%;height:100%}
.banner-text{position:absolute;top:10mm;left:8mm;z-index:2}
.banner-kicker{font:600 10px sans-serif;color:#895749;letter-spacing:.2em}
.banner-title{font-size:27px;letter-spacing:.14em;line-height:1.6;color:#4b3027;margin:1mm 0 0}
.banner-small{font-size:11px;color:#645448;letter-spacing:.05em}
.section-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid #b08d78;padding-bottom:5px;margin:4mm 0 3mm}
.section-head b{color:#923f32;font-size:15px}
.section-head small{font:10px sans-serif;color:#8d776c}
.prose{font-size:12.6px;line-height:1.77;letter-spacing:.014em;color:#2b2a28}
.prose p{margin:0 0 6px;text-indent:2em;orphans:2;widows:2}
.notes{margin-top:3.5mm;border-top:2px solid #a46952;padding-top:3.5mm;display:grid;grid-template-columns:1fr 1.3fr;gap:6mm}
.notes h3{font-size:13px;margin:0 0 7px;color:#873c30}
.vocab{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}
.vocab div{font-size:10.5px;line-height:1.55;color:#524c47}
.vocab strong{color:#893e31}
.vocab span{font-size:9px;color:#7f7670}
.allusion{font-size:10.5px;line-height:1.55;color:#514c48;margin-bottom:7px}
.allusion strong{color:#893e31}
.allusion .ref{font-size:9.3px;color:#776b63}
.allusion i{font-style:normal;color:#7a6253}
.recite{background:#f3eee6;border-left:3px solid #b38a6c;margin-top:4mm;padding:7px 12px;font-size:10.5px;line-height:1.7;color:#665648}
.recite strong{color:#8d4333}
.footer{display:flex;justify-content:space-between;border-top:1px solid #dacdbb;margin-top:4.2mm;padding-top:6px;font:10px sans-serif;color:#80776f}
.footer b{font-family:"Noto Serif CJK SC","Noto Serif SC",serif;color:#8b4538}
@media print{
 @page{size:A4 portrait;margin:0}
 html,body{background:#fff}
 .preview-bar{display:none!important}
 .sheet{width:210mm;height:297mm;min-height:0;margin:0;padding:12mm 13mm 11mm;box-shadow:none;page-break-after:avoid;break-after:avoid}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media screen and (max-width:800px){.sheet{transform-origin:top left;max-width:none}.preview-bar{padding:0 12px}}
</style>
<script src="/content.js" defer></script>
<script src="/issue-002.js" defer></script>
<script src="/issue-003.js" defer></script>
<script defer>
document.addEventListener('DOMContentLoaded',()=>{
 const issue=new URLSearchParams(location.search).get('issue');
 const d=window.SUISHI_ISSUES?.find((x,i)=>String(i+1)===issue||x.entry.id===issue)||window.SUISHI_CONTENT;
 if(!d)return;
 const e=d.entry, i=window.SUISHI_ISSUES.indexOf(d);
 const one=s=>document.querySelector(s),escape=s=>String(s||'').replace(/[&<>"']/g,t=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[t]));
 const roman=['001','002','003'][i]||String(i+1).padStart(3,'0');
 const c=['壹','贰','叁'][i]||String(i+1);
 document.title='第'+roman+'期《'+e.title+'》· A4 单页讲义';
 one('#num').textContent='ISSUE '+roman+' · '+e.theme.join(' / ');
 one('#footerIssue').textContent='延伸阅读：网页第'+roman+'期 · 亲子文言阅读';
 one('#title').textContent=e.title;
 one('#subtitle').textContent=e.subtitle||'一篇家常事，一卷成长记。';
 one('#subtitleShort').textContent='第'+c+'篇 · 文言诵读单页';
 one('#article').innerHTML=e.paragraphs.map(p=>'<p>'+escape(p)+'</p>').join('');
 const selected=d.glossary.filter((w,i)=>i<6);
 one('#vocab').innerHTML=selected.map(w=>'<div><strong>'+escape(w.term)+'</strong> <span>'+escape(w.pinyin)+'</span><br>'+escape(w.meaning)+'</div>').join('');
 one('#allusions').innerHTML=d.allusions.slice(0,2).map((a,i)=>'<div class="allusion"><strong>注'+(i+1)+' '+escape(a.title)+'</strong> <span class="ref">'+escape(a.source)+'</span><br><i>'+escape(a.quote)+'</i><br>'+escape(a.note)+'</div>').join('');
 one('#reciteText').textContent=e.memorize;
 one('#printButton').onclick=()=>window.print();
});
</script>
</head>
